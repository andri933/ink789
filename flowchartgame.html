<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowchart Puzzle - Logika Algoritma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS untuk Drag & Drop yang mulus di Mobile/Desktop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Flowchart Shapes */
        .shape-terminator {
            border-radius: 9999px; /* Oval */
            background-color: #fca5a5; /* red-300 */
            border: 2px solid #ef4444;
            color: #7f1d1d;
        }
        
        .shape-process {
            border-radius: 6px; /* Rectangle */
            background-color: #93c5fd; /* blue-300 */
            border: 2px solid #3b82f6;
            color: #1e3a8a;
        }

        .shape-input {
            transform: skew(-15deg); /* Parallelogram */
            background-color: #86efac; /* green-300 */
            border: 2px solid #22c55e;
            color: #14532d;
            margin-left: 10px;
            margin-right: 10px;
        }
        .shape-input > div {
            transform: skew(15deg); /* Fix text skew */
        }

        .shape-decision {
            background-color: #fde047; /* yellow-300 */
            border: 2px solid #eab308;
            color: #713f12;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        /* Dragging Styles */
        .sortable-ghost {
            opacity: 0.3;
            background-color: #e2e8f0;
            border: 2px dashed #94a3b8;
        }
        .sortable-drag {
            cursor: grabbing;
            opacity: 1 !important;
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 9999;
        }

        /* Auto Arrow Connector using CSS */
        .flow-block-wrapper:not(:last-child)::after {
            content: '↓';
            display: block;
            text-align: center;
            color: #94a3b8;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        /* Hide arrow when dragging */
        .sortable-ghost::after {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 md:p-4">

    <!-- Tombol Fullscreen -->
    <button onclick="toggleFullScreen()" class="fixed top-4 right-4 z-50 bg-white hover:bg-slate-100 text-slate-700 w-10 h-10 rounded-full shadow-lg flex items-center justify-center border border-slate-200 transition" title="Layar Penuh">
        <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
    </button>

    <!-- Container Utama: Single Column Layout -->
    <div class="max-w-2xl w-full flex flex-col gap-4 h-[95vh]">
        
        <!-- HEADER CARD: Info Level & Skor -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 shrink-0 relative z-20">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <a href="index.html" class="text-slate-500 hover:text-blue-600 mb-1 inline-flex items-center gap-1 text-xs font-semibold">
                        <i class="fa-solid fa-arrow-left"></i> Menu
                    </a>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-800 leading-tight">Flowchart Puzzle</h1>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block">Level</span>
                    <span class="text-2xl font-bold text-blue-600" id="level-display">1</span>
                </div>
            </div>
            
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                <div>
                    <h3 class="font-bold text-slate-700 text-sm md:text-base" id="level-title">Loading...</h3>
                    <p class="text-xs text-slate-500">Urutkan langkah dengan benar!</p>
                </div>
                <div class="bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm">
                    <span class="text-[10px] text-slate-400 uppercase font-bold block text-center">Skor</span>
                    <span class="text-lg font-bold text-green-600 block text-center" id="score-display">0</span>
                </div>
            </div>
        </div>

        <!-- MAIN AREA: Sorting Zone -->
        <div class="flex-grow bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col overflow-hidden relative">
            
            <!-- Toolbar -->
            <div class="p-3 border-b border-slate-100 bg-slate-50 flex justify-center items-center shrink-0 shadow-sm z-10">
                <button onclick="checkAnswer()" class="w-full max-w-sm bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> Cek Susunan
                </button>
            </div>

            <!-- Scrollable Area -->
            <div class="flex-grow overflow-y-auto p-4 md:p-8 bg-slate-50 scroll-smooth relative">
                <!-- Grid Pattern -->
                <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#64748b 1px, transparent 1px); background-size: 20px 20px;"></div>

                <div class="max-w-sm mx-auto relative z-10 pb-20">
                    
                    <!-- Start Marker -->
                    <div class="flex justify-center mb-2">
                        <span class="bg-slate-200 text-slate-500 text-[10px] font-mono px-2 py-1 rounded-full uppercase tracking-widest">Start</span>
                    </div>
                    
                    <!-- THE LIST -->
                    <div id="target-list" class="min-h-[200px] py-2">
                        <!-- Blocks injected here -->
                    </div>

                    <!-- End Marker -->
                    <div class="flex justify-center mt-2">
                        <span class="bg-slate-200 text-slate-500 text-[10px] font-mono px-2 py-1 rounded-full uppercase tracking-widest">End</span>
                    </div>

                </div>
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-30 hidden flex-col items-center justify-center text-center p-8 transition-opacity duration-300">
                <div id="feedback-icon" class="text-7xl mb-4 drop-shadow-md"></div>
                <h2 id="feedback-title" class="text-3xl font-extrabold mb-2 text-slate-800"></h2>
                <p id="feedback-msg" class="text-slate-600 mb-8 font-medium text-lg max-w-xs mx-auto leading-relaxed"></p>
                
                <div class="w-full max-w-xs space-y-3">
                    <button onclick="nextLevel()" id="next-btn" class="w-full bg-green-600 text-white px-6 py-4 rounded-2xl font-bold shadow-lg shadow-green-200 hover:bg-green-700 transition transform hover:-translate-y-1">
                        Lanjut Level Berikutnya
                    </button>
                    <button onclick="retryLevel()" id="retry-btn" class="hidden w-full bg-slate-200 text-slate-700 px-6 py-4 rounded-2xl font-bold hover:bg-slate-300 transition">
                        Coba Susun Lagi
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // DATABASE LEVEL
        // ==========================================
        const levels = [
            {
                id: 1,
                title: "Memasak Mie Instan",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'p1', text: 'Rebus Air', type: 'process' },
                    { id: 'p2', text: 'Masukkan Mie', type: 'process' },
                    { id: 'p3', text: 'Tuang Bumbu', type: 'process' },
                    { id: 'p4', text: 'Aduk Rata', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            },
            {
                id: 2,
                title: "Luas Persegi Panjang",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'i1', text: 'Input Panjang (p)', type: 'input' },
                    { id: 'i2', text: 'Input Lebar (l)', type: 'input' },
                    { id: 'p1', text: 'Luas = p * l', type: 'process' },
                    { id: 'o1', text: 'Tampilkan Luas', type: 'input' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            },
            {
                id: 3,
                title: "Login Komputer",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'i1', text: 'Input Password', type: 'input' },
                    { id: 'd1', text: 'Password Benar?', type: 'decision' },
                    { id: 'p1', text: 'Masuk Menu Utama', type: 'process' },
                    { id: 'p2', text: 'Tampilkan Error', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ],
                customValidation: ['start', 'i1', 'd1', 'p1', 'end'] 
            },
            {
                id: 4,
                title: "Mengisi Baterai HP",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'p1', text: 'Ambil Charger', type: 'process' },
                    { id: 'p2', text: 'Sambungkan ke HP', type: 'process' },
                    { id: 'p3', text: 'Colok ke Listrik', type: 'process' },
                    { id: 'p4', text: 'Cek Ikon Petir', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            },
            {
                id: 5,
                title: "Mencuci Pakaian",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'p1', text: 'Pisahkan Pakaian', type: 'process' },
                    { id: 'p2', text: 'Masuk Mesin Cuci', type: 'process' },
                    { id: 'p3', text: 'Tambah Deterjen', type: 'process' },
                    { id: 'p4', text: 'Jalankan Mesin', type: 'process' },
                    { id: 'p5', text: 'Jemur Pakaian', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            }
        ];

        // ==========================================
        // GAME STATE
        // ==========================================
        let currentLevelIdx = 0;
        let score = 0;
        let sortableList;

        const ui = {
            targetList: document.getElementById('target-list'),
            levelDisplay: document.getElementById('level-display'),
            scoreDisplay: document.getElementById('score-display'),
            levelTitle: document.getElementById('level-title'),
            feedbackOverlay: document.getElementById('feedback-overlay'),
            feedbackIcon: document.getElementById('feedback-icon'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackMsg: document.getElementById('feedback-msg'),
            nextBtn: document.getElementById('next-btn'),
            retryBtn: document.getElementById('retry-btn'),
            fsIcon: document.getElementById('fullscreen-icon')
        };

        // ==========================================
        // INIT & RENDER
        // ==========================================
        function initGame() {
            // Setup Single Sortable List
            sortableList = new Sortable(ui.targetList, {
                animation: 200,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                delay: 100,
                delayOnTouchOnly: true,
                onStart: function() {
                    // Mobile haptic feedback workaround
                    if (navigator.vibrate) navigator.vibrate(20);
                }
            });

            loadLevel(0);
        }

        function loadLevel(idx) {
            currentLevelIdx = idx;
            const levelData = levels[idx];
            
            ui.levelDisplay.innerText = idx + 1;
            ui.levelTitle.innerText = levelData.title;
            ui.targetList.innerHTML = '';
            ui.feedbackOverlay.classList.add('hidden');
            ui.feedbackOverlay.classList.remove('flex');

            // 1. Ambil Blok
            let blocks = [...levelData.blocks];
            
            // 2. Filter Logic (Khusus Level 3 Percabangan linear)
            if(idx === 2) blocks = blocks.filter(b => b.id !== 'p2'); 
            
            // 3. Acak Posisi (Shuffle)
            blocks.sort(() => Math.random() - 0.5);

            // 4. Render ke Drop Zone
            blocks.forEach(block => {
                const el = createBlockElement(block);
                ui.targetList.appendChild(el);
            });
        }

        function createBlockElement(block) {
            // Wrapper untuk memfasilitasi CSS arrow connector
            const wrapper = document.createElement('div');
            wrapper.className = "flow-block-wrapper";
            wrapper.dataset.id = block.id; // ID disimpan di wrapper untuk pengecekan

            const div = document.createElement('div');
            div.className = "cursor-grab active:cursor-grabbing font-bold text-center shadow-md text-sm relative z-10 transition-transform transform active:scale-105 touch-none mx-auto select-none";
            
            // Shape Styles
            if (block.type === 'terminator') {
                div.classList.add('shape-terminator', 'px-6', 'py-3', 'w-32');
            } else if (block.type === 'process') {
                div.classList.add('shape-process', 'px-4', 'py-4', 'w-48');
            } else if (block.type === 'input') {
                div.classList.add('shape-input', 'px-4', 'py-3', 'w-48');
                div.innerHTML = `<div>${block.text}</div>`;
                wrapper.appendChild(div);
                return wrapper;
            } else if (block.type === 'decision') {
                div.classList.add('shape-decision', 'w-36');
                div.innerHTML = `<span style="transform: rotate(0deg); text-align:center; line-height:1.1;">${block.text}</span>`;
                wrapper.appendChild(div);
                return wrapper;
            }

            div.innerText = block.text;
            wrapper.appendChild(div);
            return wrapper;
        }

        // ==========================================
        // CHECK LOGIC
        // ==========================================
        function checkAnswer() {
            const currentLevel = levels[currentLevelIdx];
            const userBlocks = Array.from(ui.targetList.children);
            const userIds = userBlocks.map(el => el.dataset.id);
            
            // Get Correct IDs
            let correctIds = [];
            if (currentLevel.customValidation) {
                correctIds = currentLevel.customValidation;
            } else {
                correctIds = currentLevel.blocks.map(b => b.id);
            }

            // Validasi Urutan
            let isCorrect = true;
            if (userIds.length !== correctIds.length) isCorrect = false;
            
            for (let i = 0; i < correctIds.length; i++) {
                if (userIds[i] !== correctIds[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                score += 100;
                ui.scoreDisplay.innerText = score;
                showFeedback(true, "Susunan algoritma sudah tepat dan logis.");
            } else {
                showFeedback(false, "Urutan masih belum tepat. Coba periksa logika langkahnya lagi.");
            }
        }

        function showFeedback(success, msg) {
            ui.feedbackOverlay.classList.remove('hidden');
            ui.feedbackOverlay.classList.add('flex');
            
            if (success) {
                ui.feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500 animate-bounce"></i>';
                ui.feedbackTitle.innerText = "HEBAT!";
                ui.feedbackTitle.className = "text-3xl font-extrabold mb-2 text-green-600";
                ui.feedbackMsg.innerText = msg;
                
                if (currentLevelIdx < levels.length - 1) {
                    ui.nextBtn.classList.remove('hidden');
                    ui.nextBtn.innerText = "Level Selanjutnya";
                    ui.nextBtn.onclick = nextLevel;
                    ui.retryBtn.classList.add('hidden');
                } else {
                    // Game Complete
                    ui.feedbackIcon.innerHTML = '<i class="fa-solid fa-trophy text-yellow-400 animate-bounce"></i>';
                    ui.feedbackTitle.innerText = "SELESAI!";
                    ui.feedbackTitle.className = "text-3xl font-extrabold mb-2 text-blue-600";
                    ui.feedbackMsg.innerText = "Kamu berhasil menyelesaikan semua tantangan logika flowchart!";

                    ui.nextBtn.classList.remove('hidden');
                    ui.nextBtn.innerText = "Main Ulang";
                    ui.nextBtn.onclick = restartGame;

                    ui.retryBtn.classList.remove('hidden');
                    ui.retryBtn.innerText = "Kembali ke Menu";
                    ui.retryBtn.className = "w-full bg-slate-200 text-slate-700 px-6 py-4 rounded-2xl font-bold hover:bg-slate-300 transition";
                    ui.retryBtn.onclick = () => window.location.href = 'index.html';
                }
            } else {
                ui.feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500 animate-pulse"></i>';
                ui.feedbackTitle.innerText = "KURANG TEPAT";
                ui.feedbackTitle.className = "text-3xl font-extrabold mb-2 text-red-600";
                ui.feedbackMsg.innerText = msg;
                
                ui.nextBtn.classList.add('hidden');
                ui.retryBtn.classList.remove('hidden');
                ui.retryBtn.innerText = "Coba Susun Lagi";
                ui.retryBtn.onclick = retryLevel;
            }
        }

        function nextLevel() {
            loadLevel(currentLevelIdx + 1);
        }

        function retryLevel() {
            ui.feedbackOverlay.classList.add('hidden');
            ui.feedbackOverlay.classList.remove('flex');
        }

        function restartGame() {
            score = 0;
            ui.scoreDisplay.innerText = "0";
            loadLevel(0);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error: ${err.message}`);
                });
                ui.fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    ui.fsIcon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // Start
        initGame();

    </script>
</body>
</html>
