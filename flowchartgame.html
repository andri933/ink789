<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowchart Puzzle - Logika Algoritma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS untuk Drag & Drop yang mulus di Mobile/Desktop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Flowchart Shapes */
        .shape-terminator {
            border-radius: 9999px; /* Oval */
            background-color: #fca5a5; /* red-300 */
            border: 2px solid #ef4444;
            color: #7f1d1d;
        }
        
        .shape-process {
            border-radius: 4px; /* Rectangle */
            background-color: #93c5fd; /* blue-300 */
            border: 2px solid #3b82f6;
            color: #1e3a8a;
        }

        .shape-input {
            transform: skew(-20deg); /* Parallelogram */
            background-color: #86efac; /* green-300 */
            border: 2px solid #22c55e;
            color: #14532d;
            margin-left: 10px;
            margin-right: 10px;
        }
        .shape-input > div {
            transform: skew(20deg); /* Fix text skew */
        }

        .shape-decision {
            background-color: #fde047; /* yellow-300 */
            border: 2px solid #eab308;
            color: #713f12;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            padding: 1.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dragging Styles */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #f1f5f9;
            border: 2px dashed #94a3b8;
        }
        .sortable-drag {
            cursor: grabbing;
        }

        /* Arrow Connector */
        .arrow-down {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            margin: 4px 0;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 md:p-4 relative">

    <!-- Tombol Fullscreen -->
    <button onclick="toggleFullScreen()" class="fixed top-4 right-4 z-50 bg-white hover:bg-slate-100 text-slate-700 w-10 h-10 rounded-full shadow-lg flex items-center justify-center border border-slate-200 transition" title="Layar Penuh">
        <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
    </button>

    <!-- Container Utama -->
    <!-- UPDATED: Menggunakan h-[95vh] dan pembagian flex yang lebih baik untuk mobile -->
    <div class="max-w-6xl w-full flex flex-col md:flex-row gap-3 md:gap-6 h-[95vh] md:h-[90vh]">
        
        <!-- SIDEBAR: Info & Bank Soal -->
        <!-- UPDATED: h-[40%] di mobile agar tidak memakan seluruh layar -->
        <div class="w-full md:w-1/3 flex flex-col gap-2 md:gap-4 h-[40%] md:h-full shrink-0">
            
            <!-- Header Card -->
            <div class="bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200 shrink-0">
                <a href="index.html" class="text-slate-500 hover:text-blue-600 mb-2 md:mb-4 inline-block flex items-center gap-2 text-xs md:text-sm font-semibold">
                    <i class="fa-solid fa-arrow-left"></i> Kembali
                </a>
                <h1 class="text-lg md:text-2xl font-bold text-slate-800 mb-1">Flowchart Puzzle</h1>
                <p class="text-slate-500 text-xs md:text-sm">Susun blok algoritma dengan urutan yang logis.</p>
                
                <div class="mt-2 md:mt-4 flex justify-between items-center bg-slate-50 p-2 md:p-3 rounded-lg border border-slate-100">
                    <div>
                        <span class="text-[10px] md:text-xs text-slate-400 uppercase font-bold">Level</span>
                        <div class="text-lg md:text-xl font-bold text-blue-600" id="level-display">1</div>
                    </div>
                    <div>
                        <span class="text-[10px] md:text-xs text-slate-400 uppercase font-bold">Skor</span>
                        <div class="text-lg md:text-xl font-bold text-green-600" id="score-display">0</div>
                    </div>
                </div>
            </div>

            <!-- Block Bank (Source) -->
            <div class="bg-white rounded-2xl p-3 md:p-4 shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden min-h-0">
                <h3 class="font-bold text-slate-700 mb-2 md:mb-3 flex items-center gap-2 text-sm md:text-base shrink-0">
                    <i class="fa-solid fa-box-open text-orange-500"></i> Bank Blok
                </h3>
                
                <div id="source-list" class="flex-grow overflow-y-auto space-y-2 md:space-y-3 p-2 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                    <!-- Blocks will be injected here -->
                </div>
            </div>
        </div>

        <!-- MAIN AREA: Canvas Flowchart -->
        <!-- UPDATED: h-[60%] di mobile -->
        <div class="w-full md:w-2/3 bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col overflow-hidden relative h-[60%] md:h-full">
            
            <div class="p-3 md:p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-slate-700 text-sm md:text-base truncate mr-2" id="level-title">Loading...</h3>
                <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 md:px-6 py-1.5 md:py-2 rounded-lg font-semibold shadow-md transition transform active:scale-95 flex items-center gap-2 text-xs md:text-sm shrink-0">
                    <i class="fa-solid fa-play"></i> <span class="hidden sm:inline">Cek Alur</span><span class="sm:hidden">Cek</span>
                </button>
            </div>

            <!-- Drop Zone -->
            <div class="flex-grow overflow-y-auto p-4 md:p-6 relative bg-grid-slate-100">
                <!-- Background Grid Pattern -->
                <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px;"></div>

                <div class="max-w-md mx-auto relative z-10 min-h-full flex flex-col">
                    
                    <div class="text-center mb-4 text-xs text-slate-400 font-mono shrink-0">-- MULAI --</div>
                    
                    <!-- UPDATED: min-h dikurangi agar tidak overflow di layar kecil -->
                    <div id="target-list" class="space-y-3 md:space-y-4 flex-grow min-h-[150px] pb-10">
                        <!-- Drop Target -->
                        <div class="text-slate-400 text-center italic mt-4 md:mt-10 pointer-events-none text-sm" id="empty-msg">
                            Seret blok ke sini...
                        </div>
                    </div>

                    <div class="text-center mt-4 text-xs text-slate-400 font-mono shrink-0">-- SELESAI --</div>

                </div>
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-20 hidden flex-col items-center justify-center text-center p-8">
                <div id="feedback-icon" class="text-6xl mb-4"></div>
                <h2 id="feedback-title" class="text-2xl font-bold mb-2"></h2>
                <p id="feedback-msg" class="text-slate-600 mb-6"></p>
                <button onclick="nextLevel()" id="next-btn" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">
                    Level Selanjutnya
                </button>
                <button onclick="retryLevel()" id="retry-btn" class="hidden bg-slate-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-slate-700 transition">
                    Coba Lagi
                </button>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // DATABASE LEVEL (Local JSON)
        // ==========================================
        const levels = [
            {
                id: 1,
                title: "Algoritma Memasak Mie Instan",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'p1', text: 'Rebus Air', type: 'process' },
                    { id: 'p2', text: 'Masukkan Mie', type: 'process' },
                    { id: 'p3', text: 'Tuang Bumbu', type: 'process' },
                    { id: 'p4', text: 'Aduk Rata', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            },
            {
                id: 2,
                title: "Menghitung Luas Persegi Panjang",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'i1', text: 'Input Panjang (p)', type: 'input' },
                    { id: 'i2', text: 'Input Lebar (l)', type: 'input' },
                    { id: 'p1', text: 'Luas = p * l', type: 'process' },
                    { id: 'o1', text: 'Tampilkan Luas', type: 'input' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ]
            },
            {
                id: 3,
                title: "Login Komputer (Password)",
                blocks: [
                    { id: 'start', text: 'Mulai', type: 'terminator' },
                    { id: 'i1', text: 'Input Password', type: 'input' },
                    { id: 'd1', text: 'Password Benar?', type: 'decision' },
                    { id: 'p1', text: 'Masuk Menu Utama', type: 'process' },
                    { id: 'p2', text: 'Tampilkan Error', type: 'process' },
                    { id: 'end', text: 'Selesai', type: 'terminator' }
                ],
                // Khusus level 3, validasi manual karena ada percabangan
                // Kita sederhanakan menjadi urutan logis saja untuk puzzle drag-drop linear
                customValidation: ['start', 'i1', 'd1', 'p1', 'end'] 
            }
        ];

        // ==========================================
        // GAME STATE
        // ==========================================
        let currentLevelIdx = 0;
        let score = 0;
        let sourceSortable, targetSortable;

        const ui = {
            sourceList: document.getElementById('source-list'),
            targetList: document.getElementById('target-list'),
            levelDisplay: document.getElementById('level-display'),
            scoreDisplay: document.getElementById('score-display'),
            levelTitle: document.getElementById('level-title'),
            emptyMsg: document.getElementById('empty-msg'),
            feedbackOverlay: document.getElementById('feedback-overlay'),
            feedbackIcon: document.getElementById('feedback-icon'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackMsg: document.getElementById('feedback-msg'),
            nextBtn: document.getElementById('next-btn'),
            retryBtn: document.getElementById('retry-btn'),
            fsIcon: document.getElementById('fullscreen-icon')
        };

        // ==========================================
        // INIT & RENDER
        // ==========================================
        function initGame() {
            // Setup SortableJS
            // Updated: Added touch-action fix logic implicitly by Sortable, 
            // but we add touch-none class to elements
            sourceSortable = new Sortable(ui.sourceList, {
                group: 'shared', // set both lists to same group
                animation: 150,
                sort: false, // disable sorting in source
                delay: 100, // slight delay prevents accidental drags on scroll
                delayOnTouchOnly: true
            });

            targetSortable = new Sortable(ui.targetList, {
                group: 'shared',
                animation: 150,
                onAdd: function (evt) {
                    ui.emptyMsg.style.display = 'none';
                    addArrow(evt.item);
                },
                onRemove: function (evt) {
                    removeArrow(evt.item);
                    if (ui.targetList.children.length === 0 || (ui.targetList.children.length === 1 && ui.targetList.contains(ui.emptyMsg))) {
                        ui.emptyMsg.style.display = 'block';
                    }
                }
            });

            loadLevel(0);
        }

        function loadLevel(idx) {
            currentLevelIdx = idx;
            const levelData = levels[idx];
            
            ui.levelDisplay.innerText = idx + 1;
            ui.levelTitle.innerText = levelData.title;
            ui.sourceList.innerHTML = '';
            ui.targetList.innerHTML = '';
            ui.targetList.appendChild(ui.emptyMsg);
            ui.emptyMsg.style.display = 'block';
            ui.feedbackOverlay.classList.add('hidden');

            // Copy blocks and shuffle
            let blocks = [...levelData.blocks];
            // Khusus level 3 kita filter item error agar linear logic pass
            if(idx === 2) blocks = blocks.filter(b => b.id !== 'p2'); 
            
            blocks.sort(() => Math.random() - 0.5);

            blocks.forEach(block => {
                const el = createBlockElement(block);
                ui.sourceList.appendChild(el);
            });
        }

        function createBlockElement(block) {
            const div = document.createElement('div');
            div.dataset.id = block.id;
            // UPDATED: Added 'touch-none' to prevent page scrolling when touching blocks
            div.className = "cursor-grab select-none font-medium text-center shadow-sm text-sm relative z-10 p-2 md:p-3 touch-none";
            
            // Apply shape styles
            if (block.type === 'terminator') {
                div.classList.add('shape-terminator', 'px-4', 'md:px-6', 'py-2');
            } else if (block.type === 'process') {
                div.classList.add('shape-process', 'px-3', 'md:px-4', 'py-2', 'md:py-3');
            } else if (block.type === 'input') {
                div.classList.add('shape-input', 'px-3', 'md:px-4', 'py-2');
                div.innerHTML = `<div>${block.text}</div>`; // Inner div to un-skew text
                return div; // Return early because innerHTML set
            } else if (block.type === 'decision') {
                div.classList.add('shape-decision', 'w-24', 'md:w-32', 'h-20', 'md:h-24', 'mx-auto', 'text-xs', 'md:text-sm');
                // Adjust text for diamond
                div.innerHTML = `<span style="transform: rotate(0deg); text-align:center; line-height:1.1;">${block.text}</span>`;
                return div;
            }

            div.innerText = block.text;
            return div;
        }

        function addArrow(item) {
            // Visual logic to add arrow handled by CSS mostly, 
            // but we can add a connector div if we want fancy lines.
            // For simple vertical stack, margin is enough.
            item.style.marginBottom = "1.5rem"; // Space for arrow
        }

        function removeArrow(item) {
            item.style.marginBottom = "0.5rem";
        }

        // ==========================================
        // CHECK LOGIC
        // ==========================================
        function checkAnswer() {
            const currentLevel = levels[currentLevelIdx];
            const userBlocks = Array.from(ui.targetList.children).filter(el => el.id !== 'empty-msg');
            
            if (userBlocks.length === 0) {
                alert("Susun blok terlebih dahulu!");
                return;
            }

            const userIds = userBlocks.map(el => el.dataset.id);
            
            // Get Correct IDs
            let correctIds = [];
            if (currentLevel.customValidation) {
                correctIds = currentLevel.customValidation;
            } else {
                correctIds = currentLevel.blocks.map(b => b.id);
            }

            // Validasi Panjang
            if (userIds.length !== correctIds.length) {
                showFeedback(false, "Jumlah blok tidak sesuai. Ada yang kurang atau berlebih.");
                return;
            }

            // Validasi Urutan
            let isCorrect = true;
            for (let i = 0; i < correctIds.length; i++) {
                if (userIds[i] !== correctIds[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                score += 100;
                ui.scoreDisplay.innerText = score;
                showFeedback(true, "Algoritma Tepat! Logika berjalan mulus.");
            } else {
                showFeedback(false, "Urutan masih salah. Coba pikirkan langkah demi langkah.");
            }
        }

        function showFeedback(success, msg) {
            ui.feedbackOverlay.classList.remove('hidden');
            ui.feedbackOverlay.classList.add('flex');
            
            if (success) {
                ui.feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500 animate-bounce"></i>';
                ui.feedbackTitle.innerText = "BERHASIL!";
                ui.feedbackTitle.className = "text-2xl font-bold mb-2 text-green-600";
                ui.feedbackMsg.innerText = msg;
                
                if (currentLevelIdx < levels.length - 1) {
                    ui.nextBtn.classList.remove('hidden');
                    ui.nextBtn.innerText = "Level Selanjutnya";
                    ui.nextBtn.onclick = nextLevel;
                    ui.retryBtn.classList.add('hidden');
                } else {
                    ui.nextBtn.classList.remove('hidden');
                    ui.nextBtn.innerText = "Selesai (Kembali ke Menu)";
                    ui.nextBtn.onclick = () => window.location.href = 'index.html';
                    ui.retryBtn.classList.add('hidden');
                }
            } else {
                ui.feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500 animate-pulse"></i>';
                ui.feedbackTitle.innerText = "UPS, SALAH!";
                ui.feedbackTitle.className = "text-2xl font-bold mb-2 text-red-600";
                ui.feedbackMsg.innerText = msg;
                
                ui.nextBtn.classList.add('hidden');
                ui.retryBtn.classList.remove('hidden');
            }
        }

        function nextLevel() {
            loadLevel(currentLevelIdx + 1);
        }

        function retryLevel() {
            ui.feedbackOverlay.classList.add('hidden');
            // Reset blocks back to source? Or let user fix it?
            // Let user fix it is better UX.
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
                ui.fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    ui.fsIcon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // Start
        initGame();

    </script>
</body>
</html>
