<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Jarkom 7 - Pertemuan 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Library untuk membaca CSV dari Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .correct-anim { animation: pulseGreen 0.5s ease-in-out; }
        .wrong-anim { animation: shakeRed 0.5s ease-in-out; }
        
        @keyframes pulseGreen {
            0%, 100% { background-color: white; }
            50% { background-color: #dcfce7; transform: scale(1.02); }
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); background-color: white; }
            25% { transform: translateX(-5px); background-color: #fee2e2; }
            75% { transform: translateX(5px); background-color: #fee2e2; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-500 to-teal-600 min-h-screen flex items-center justify-center p-4 relative">

    <!-- Tombol Fullscreen (Floating di Luar Container) -->
    <button onclick="toggleFullScreen()" class="fixed top-4 right-4 z-50 bg-white/20 hover:bg-white/40 text-white w-10 h-10 rounded-full backdrop-blur-md transition shadow-lg flex items-center justify-center border border-white/30" title="Layar Penuh">
        <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
    </button>

    <!-- Container Utama -->
    <div class="max-w-2xl w-full glass-panel rounded-2xl shadow-2xl overflow-hidden relative min-h-[500px] flex flex-col">
        
        <!-- Header -->
        <div class="bg-white/50 p-4 border-b border-slate-200 grid grid-cols-3 items-center">
            <!-- Kiri: Tombol Kembali -->
            <div class="justify-self-start">
                <a href="index.html" class="text-teal-600 hover:text-teal-800 font-semibold flex items-center gap-2 text-sm md:text-base">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Kembali</span>
                </a>
            </div>

            <!-- Tengah: Skor -->
            <div class="justify-self-center">
                <div class="font-bold text-slate-700 text-lg md:text-xl border px-6 py-1 rounded-full bg-white shadow-sm">
                    Skor: <span id="score" class="text-teal-600">0</span>
                </div>
            </div>

            <!-- Kanan: Tombol Skip -->
            <div class="justify-self-end">
                <button onclick="skipQuestion()" class="bg-orange-100 text-orange-600 hover:bg-orange-200 px-4 py-1.5 rounded-lg text-sm font-bold transition flex items-center gap-1" title="Lewati Soal">
                    Skip <i class="fa-solid fa-forward"></i>
                </button>
            </div>
        </div>

        <!-- Loading / Error Screen -->
        <div id="loading-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white transition-opacity duration-500 p-8 text-center">
            <div id="loader-icon" class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600 mb-4"></div>
            <h3 class="text-lg font-bold text-slate-700 mb-2" id="loading-title">Memuat Soal Pertemuan 2...</h3>
            <p class="text-slate-500 text-sm" id="loading-message">Menghubungkan ke database</p>
            <div id="error-actions" class="hidden mt-6">
                <button onclick="location.reload()" class="px-6 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg font-medium transition shadow-lg">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Coba Lagi
                </button>
            </div>
        </div>

        <!-- Game Over Screen (Hidden by default) -->
        <div id="game-over-screen" class="hidden absolute inset-0 z-30 bg-white flex-col items-center justify-center text-center p-8">
            <i class="fa-solid fa-star text-6xl text-yellow-400 mb-4 animate-bounce"></i>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Hebat!</h2>
            <p class="text-slate-500 mb-6">Kuis Pertemuan 2 Selesai.</p>
            
            <!-- Skor Akhir & Persentase -->
            <div class="mb-8 p-6 bg-slate-50 rounded-xl border border-slate-100 w-full max-w-sm">
                <div class="text-sm text-slate-500 font-medium uppercase tracking-wide mb-1">Total Skor</div>
                <div class="text-5xl font-extrabold text-teal-600 mb-2" id="final-score">0</div>
                <div class="border-t border-slate-200 my-2"></div>
                <div class="flex justify-between items-center mt-2 px-4">
                    <span class="text-slate-600">Nilai Akhir:</span>
                    <span class="text-2xl font-bold text-green-600" id="final-percent">0%</span>
                </div>
            </div>

            <button onclick="location.reload()" class="px-8 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition transform hover:scale-105 shadow-lg w-full max-w-xs">
                Ulangi Kuis
            </button>
        </div>

        <!-- Quiz Area -->
        <div id="quiz-area" class="p-6 md:p-10 flex-grow flex flex-col justify-center hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-teal-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <!-- Question -->
            <div class="mb-6 text-center">
                <span class="inline-block px-3 py-1 bg-teal-100 text-teal-600 rounded-full text-xs font-bold mb-4">
                    Soal <span id="current-question-num">1</span> / <span id="total-questions">10</span>
                </span>
                <!-- Ukuran font diperkecil dan tidak bold -->
                <h2 id="question-text" class="text-xl md:text-2xl font-medium text-slate-800 leading-relaxed">
                    <!-- Soal akan muncul di sini -->
                </h2>
            </div>

            <!-- Answer Input -->
            <div class="space-y-4 mt-auto md:mt-0">
                <input type="text" id="answer-input" 
                    class="w-full p-4 text-center text-lg border-2 border-slate-300 rounded-xl focus:border-teal-500 focus:outline-none transition uppercase placeholder:normal-case font-bold text-slate-700"
                    placeholder="KETIK JAWABANMU..." autocomplete="off">
                
                <button id="submit-btn" onclick="checkAnswer()" 
                    class="w-full py-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-lg shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                    <span>Jawab</span> <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="mt-6 text-center h-6 font-semibold text-lg transition-opacity opacity-0">
                <!-- Feedback muncul di sini -->
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // ==========================================
        // KONFIGURASI PENTING
        // ==========================================
        
        // PASTE LINK CSV UNTUK "SOAL2" DI BAWAH INI
        // Caranya: File > Share > Publish to Web > Pilih Tab "soal2" > Pilih "CSV" > Salin Link
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRTESr5U38MR01quLz0VXcrwVcanIJUvMPjPX5lNOY40lP5p4czGenzphqymxPlSPmAnJVVYeL70M1/pub?gid=1065637164&single=true&output=csv'; 

        // ==========================================
        // LOGIKA GAME
        // ==========================================
        
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswering = false;

        const ui = {
            loading: document.getElementById('loading-screen'),
            loaderIcon: document.getElementById('loader-icon'),
            loadingTitle: document.getElementById('loading-title'),
            loadingMessage: document.getElementById('loading-message'),
            errorActions: document.getElementById('error-actions'),
            quizArea: document.getElementById('quiz-area'),
            gameOver: document.getElementById('game-over-screen'),
            questionText: document.getElementById('question-text'),
            currentNum: document.getElementById('current-question-num'),
            totalNum: document.getElementById('total-questions'),
            progressBar: document.getElementById('progress-bar'),
            scoreDisplay: document.getElementById('score'),
            finalScore: document.getElementById('final-score'),
            finalPercent: document.getElementById('final-percent'),
            input: document.getElementById('answer-input'),
            feedback: document.getElementById('feedback'),
            card: document.querySelector('.glass-panel'),
            fsIcon: document.getElementById('fullscreen-icon')
        };

        // Fungsi Memulai Game
        function initGame() {
            if (!GOOGLE_SHEET_CSV_URL) {
                showError("URL Database Kosong", "Silakan tempel Link CSV dari Sheet 'soal2' di dalam kode.");
                return;
            }

            ui.loadingMessage.innerText = "Mengunduh soal pertemuan 2...";

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    const success = processData(results.data);
                    if (!success) {
                        showError("Data Kosong", "Tidak ada soal ditemukan. Pastikan Sheet 'soal2' sudah dipublish sebagai CSV.");
                    }
                },
                error: function(err) {
                    console.error("Gagal ambil CSV:", err);
                    showError("Gagal Terhubung", "Tidak dapat menghubungi database. Periksa koneksi internet Anda.");
                }
            });
        }

        // Tampilkan Pesan Error
        function showError(title, message) {
            ui.loaderIcon.className = "fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4";
            ui.loadingTitle.innerText = title;
            ui.loadingTitle.classList.add("text-red-600");
            ui.loadingMessage.innerText = message;
            ui.errorActions.classList.remove("hidden");
        }

        // Proses Data menjadi Format Soal
        function processData(rawData) {
            if (!rawData || rawData.length === 0) return false;

            const processedQuestions = rawData
                .filter(row => row && row[0] && row[1]) 
                .map(row => ({
                    question: row[0],
                    answer: row[1].trim().toUpperCase()
                }));

            if (processedQuestions.length > 0) {
                questions = processedQuestions;
                questions.sort(() => Math.random() - 0.5);

                ui.loading.classList.add('hidden');
                ui.quizArea.classList.remove('hidden');
                ui.totalNum.innerText = questions.length;
                
                loadQuestion();
                return true; 
            }
            return false; 
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            ui.questionText.innerText = q.question;
            ui.currentNum.innerText = currentQuestionIndex + 1;
            ui.input.value = '';
            ui.input.focus();
            ui.feedback.style.opacity = '0';
            
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            ui.progressBar.style.width = `${progress}%`;
            
            isAnswering = true;
        }

        function checkAnswer() {
            if (!isAnswering) return;

            const userAnswer = ui.input.value.trim().toUpperCase();
            if(userAnswer === "") {
                ui.input.focus();
                return; 
            }

            const correctAnswer = questions[currentQuestionIndex].answer;
            let isCorrect = false;
            
            const cleanUser = userAnswer.replace(/[^A-Z0-9]/g, '');
            const cleanKey = correctAnswer.replace(/[^A-Z0-9]/g, '');

            if (cleanUser === cleanKey) {
                isCorrect = true;
            }

            if (isCorrect) {
                isAnswering = false; 
                score += 10;
                ui.scoreDisplay.innerText = score;
                showFeedback(true, "Benar! 🎉");
                
                setTimeout(() => {
                    nextQuestion();
                }, 1500);

            } else {
                showFeedback(false, "Jawaban Salah! Coba lagi.");
                ui.input.value = '';
                ui.input.focus();
            }
        }

        function skipQuestion() {
            if (!isAnswering && !document.getElementById('feedback').innerText.includes("Salah")) return;
            
            showFeedback(false, "Dilewati (Tidak ada poin).");
            isAnswering = false;

            setTimeout(() => {
                nextQuestion();
            }, 1000);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function showFeedback(isCorrect, message) {
            ui.feedback.innerText = message;
            ui.feedback.style.opacity = '1';
            let colorClass = isCorrect ? 'text-green-600' : 'text-red-500';
            if (message.includes("Dilewati")) colorClass = 'text-orange-500';

            ui.feedback.className = `mt-6 text-center h-6 font-bold text-lg transition-opacity ${colorClass}`;
            
            ui.card.classList.remove('correct-anim', 'wrong-anim');
            void ui.card.offsetWidth; 
            ui.card.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
        }

        function endGame() {
            ui.quizArea.classList.add('hidden');
            ui.gameOver.classList.remove('hidden');
            ui.gameOver.classList.add('flex');
            
            const maxPossibleScore = questions.length * 10;
            const percentage = maxPossibleScore > 0 ? Math.round((score / maxPossibleScore) * 100) : 0;

            ui.finalScore.innerText = score;
            ui.finalPercent.innerText = percentage + "%";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
                ui.fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    ui.fsIcon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        ui.input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        initGame();

    </script>
</body>
</html>
