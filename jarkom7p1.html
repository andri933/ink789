<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Jarkom 1 - Informatika SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Library untuk membaca CSV dari Google Sheet dengan mudah -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .correct-anim { animation: pulseGreen 0.5s ease-in-out; }
        .wrong-anim { animation: shakeRed 0.5s ease-in-out; }
        
        @keyframes pulseGreen {
            0%, 100% { background-color: white; }
            50% { background-color: #dcfce7; transform: scale(1.02); }
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); background-color: white; }
            25% { transform: translateX(-5px); background-color: #fee2e2; }
            75% { transform: translateX(5px); background-color: #fee2e2; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="max-w-2xl w-full glass-panel rounded-2xl shadow-2xl overflow-hidden relative min-h-[500px] flex flex-col">
        
        <!-- Header -->
        <div class="bg-white/50 p-4 border-b border-slate-200 flex justify-between items-center">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </a>
            <div class="font-bold text-slate-700">
                Skor: <span id="score" class="text-blue-600 text-xl">0</span>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500">Memuat Soal dari Database...</p>
        </div>

        <!-- Game Over Screen (Hidden by default) -->
        <div id="game-over-screen" class="hidden absolute inset-0 z-30 bg-white flex-col items-center justify-center text-center p-8">
            <i class="fa-solid fa-trophy text-6xl text-yellow-400 mb-4"></i>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Permainan Selesai!</h2>
            <p class="text-slate-500 mb-6">Kamu telah menyelesaikan semua soal.</p>
            <div class="text-5xl font-bold text-blue-600 mb-8" id="final-score">0</div>
            <button onclick="location.reload()" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition transform hover:scale-105">
                Main Lagi
            </button>
        </div>

        <!-- Quiz Area -->
        <div id="quiz-area" class="p-6 md:p-10 flex-grow flex flex-col justify-center hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <!-- Question -->
            <div class="mb-8 text-center">
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-xs font-bold mb-4">
                    Soal <span id="current-question-num">1</span> / <span id="total-questions">10</span>
                </span>
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-relaxed">
                    <!-- Soal akan muncul di sini -->
                </h2>
            </div>

            <!-- Answer Input -->
            <div class="space-y-4">
                <input type="text" id="answer-input" 
                    class="w-full p-4 text-center text-lg border-2 border-slate-300 rounded-xl focus:border-blue-500 focus:outline-none transition uppercase placeholder:normal-case"
                    placeholder="Ketik jawabanmu di sini..." autocomplete="off">
                
                <button id="submit-btn" onclick="checkAnswer()" 
                    class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-lg shadow-lg transition transform active:scale-95">
                    Jawab <i class="fa-solid fa-paper-plane ml-2"></i>
                </button>
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="mt-6 text-center h-6 font-semibold text-lg transition-opacity opacity-0">
                <!-- Feedback muncul di sini -->
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // ==========================================
        // KONFIGURASI PENTING
        // ==========================================
        
        // GANTI LINK DI BAWAH INI DENGAN LINK CSV ANDA DARI LANGKAH 1
        // Contoh: 'https://docs.google.com/spreadsheets/d/e/2PACX-xxxx/pub?gid=0&single=true&output=csv'
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRTESr5U38MR01quLz0VXcrwVcanIJUvMPjPX5lNOY40lP5p4czGenzphqymxPlSPmAnJVVYeL70M1/pub?gid=0&single=true&output=csv'; 

        // Data Cadangan (Backup) jika link di atas kosong atau error
        // Ini diambil dari screenshot yang Anda kirim
        const BACKUP_DATA = [
            ["Jaringan terhubung ke seluruh dunia", "INTERNET"],
            ["Jaringan komputer mencakup satu ruangan kelas / satu gedung", "LAN"],
            ["Jaringan Komputer yang mencakup luas sebuah kota", "MAN"],
            ["Jaringan Komputer antar kota , antar pulau , antar negara", "WAN"],
            ["Internet saat ini telah dapat menghubungkan komputer, perangkat", "IOT"],
            ["Salah satu media komunikasi tradisional", "SURAT"],
            ["Surat Elektronik = SUREL =", "E-MAIL"],
            ["Salah satu contoh ISP (penyedia internet mobile)", "TELKOMSEL"],
            ["Layanan pembayaran melalui internet", "E-BANKING"],
            ["Layanan pendidikan melalui internet", "E-LEARNING"],
            ["Aktivitas penjualan, pembelian, pemasaran produk", "E-COMMERCE"]
        ];

        // ==========================================
        // LOGIKA GAME
        // ==========================================
        
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswering = false;

        const ui = {
            loading: document.getElementById('loading-screen'),
            quizArea: document.getElementById('quiz-area'),
            gameOver: document.getElementById('game-over-screen'),
            questionText: document.getElementById('question-text'),
            currentNum: document.getElementById('current-question-num'),
            totalNum: document.getElementById('total-questions'),
            progressBar: document.getElementById('progress-bar'),
            scoreDisplay: document.getElementById('score'),
            finalScore: document.getElementById('final-score'),
            input: document.getElementById('answer-input'),
            feedback: document.getElementById('feedback'),
            card: document.querySelector('.glass-panel')
        };

        // Fungsi Memulai Game
        async function initGame() {
            try {
                if (GOOGLE_SHEET_CSV_URL) {
                    // Coba ambil data dari Google Sheet
                    Papa.parse(GOOGLE_SHEET_CSV_URL, {
                        download: true,
                        header: false, // Kita anggap tidak ada header karena di screenshot lgsg data
                        complete: function(results) {
                            if(results.data && results.data.length > 0) {
                                processData(results.data);
                            } else {
                                console.warn("Data kosong, menggunakan backup");
                                processData(BACKUP_DATA);
                            }
                        },
                        error: function(err) {
                            console.error("Gagal ambil CSV:", err);
                            processData(BACKUP_DATA);
                        }
                    });
                } else {
                    // Jika URL kosong, pakai data backup
                    console.log("URL kosong, menggunakan data backup");
                    setTimeout(() => processData(BACKUP_DATA), 1000); // Simulasi loading
                }
            } catch (e) {
                processData(BACKUP_DATA);
            }
        }

        // Proses Data menjadi Format Soal
        function processData(rawData) {
            // Filter baris kosong dan ambil kolom A (0) dan B (1)
            questions = rawData
                .filter(row => row[0] && row[1]) // Pastikan ada soal dan jawaban
                .map(row => ({
                    question: row[0],
                    answer: row[1].trim().toUpperCase() // Jawaban kita simpan uppercase biar mudah dicocokkan
                }));

            // Acak urutan soal (Opsional, matikan jika ingin urut)
            questions.sort(() => Math.random() - 0.5);

            if (questions.length > 0) {
                ui.loading.classList.add('hidden');
                ui.quizArea.classList.remove('hidden');
                ui.totalNum.innerText = questions.length;
                loadQuestion();
            } else {
                alert("Tidak ada soal yang ditemukan!");
            }
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            ui.questionText.innerText = q.question;
            ui.currentNum.innerText = currentQuestionIndex + 1;
            ui.input.value = '';
            ui.input.focus();
            ui.feedback.style.opacity = '0';
            
            // Update Progress Bar
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            ui.progressBar.style.width = `${progress}%`;
            
            isAnswering = true;
        }

        function checkAnswer() {
            if (!isAnswering) return;

            const userAnswer = ui.input.value.trim().toUpperCase();
            const correctAnswer = questions[currentQuestionIndex].answer;
            const similarity = getSimilarity(userAnswer, correctAnswer);

            // Logika Kebenaran (Bisa persis sama atau mirip dikit typo)
            // Di sini kita pakai persis sama atau mengandung kata kunci
            let isCorrect = false;
            
            // Cek persis sama atau user mengetik E-MAIL tapi jawaban EMAIL (menghapus tanda baca)
            const cleanUser = userAnswer.replace(/[^A-Z0-9]/g, '');
            const cleanKey = correctAnswer.replace(/[^A-Z0-9]/g, '');

            if (cleanUser === cleanKey && cleanUser !== "") {
                isCorrect = true;
            }

            isAnswering = false;

            if (isCorrect) {
                score += 10;
                ui.scoreDisplay.innerText = score;
                showFeedback(true, "Benar! 🎉");
            } else {
                showFeedback(false, `Salah! Jawaban: ${correctAnswer}`);
            }

            // Lanjut ke soal berikutnya setelah jeda
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 2000);
        }

        function showFeedback(isCorrect, message) {
            ui.feedback.innerText = message;
            ui.feedback.style.opacity = '1';
            ui.feedback.className = `mt-6 text-center h-6 font-bold text-lg transition-opacity ${isCorrect ? 'text-green-600' : 'text-red-500'}`;
            
            // Animasi visual pada kartu
            ui.card.classList.remove('correct-anim', 'wrong-anim');
            void ui.card.offsetWidth; // Trigger reflow
            ui.card.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
        }

        function endGame() {
            ui.quizArea.classList.add('hidden');
            ui.gameOver.classList.remove('hidden');
            ui.gameOver.classList.add('flex');
            ui.finalScore.innerText = score;
            
            // Confetti effect simpel bisa ditambahkan disini
        }

        // Helper: Deteksi Enter key
        ui.input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        // Helper: Simple string similarity (Opsional, tidak dipakai aktif di logika utama tapi bagus ada)
        function getSimilarity(s1, s2) {
            // Placeholder logic jika ingin fuzzy search
            return s1 === s2;
        }

        // Jalankan Game
        initGame();

    </script>
</body>
</html>
