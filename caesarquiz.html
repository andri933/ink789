<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Caesar Cipher - InfoEdu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Library untuk membaca CSV dari Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .correct-anim { animation: pulseGreen 0.5s ease-in-out; }
        .wrong-anim { animation: shakeRed 0.5s ease-in-out; }
        
        /* Animasi Input */
        .char-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-color: #ef4444; /* red-500 */
        }
        
        @keyframes pulseGreen {
            0%, 100% { background-color: white; }
            50% { background-color: #dcfce7; transform: scale(1.02); }
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); background-color: white; }
            25% { transform: translateX(-5px); background-color: #fee2e2; }
            75% { transform: translateX(5px); background-color: #fee2e2; }
        }

        /* Hapus arrow pada input number (jika ada) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
        <div class="absolute top-0 right-0 w-96 h-96 bg-red-500 rounded-full mix-blend-multiply filter blur-3xl"></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl"></div>
    </div>

    <!-- Tombol Fullscreen -->
    <button onclick="toggleFullScreen()" class="fixed top-4 right-4 z-50 bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full backdrop-blur-md transition shadow flex items-center justify-center border border-white/20" title="Layar Penuh">
        <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
    </button>

    <!-- Container Utama -->
    <div class="max-w-2xl w-full glass-panel rounded-2xl shadow-2xl overflow-hidden relative z-10 min-h-[500px] flex flex-col">
        
        <!-- Header -->
        <div class="bg-white/50 p-4 border-b border-slate-200 grid grid-cols-3 items-center">
            <!-- Kiri: Tombol Kembali -->
            <div class="justify-self-start">
                <a href="index.html" class="text-slate-600 hover:text-red-600 font-semibold flex items-center gap-2 text-sm md:text-base transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Kembali</span>
                </a>
            </div>

            <!-- Tengah: Skor -->
            <div class="justify-self-center">
                <div class="font-bold text-slate-700 text-lg md:text-xl border px-6 py-1 rounded-full bg-white shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-star text-yellow-500"></i> Skor: <span id="score" class="text-red-600">0</span>
                </div>
            </div>

            <!-- Kanan: Kosong -->
            <div class="justify-self-end w-8"></div>
        </div>

        <!-- Loading / Error Screen -->
        <div id="loading-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/90 backdrop-blur-sm transition-opacity duration-500 p-8 text-center">
            <div id="loader-icon" class="animate-spin rounded-full h-12 w-12 border-b-4 border-red-600 mb-4"></div>
            <h3 class="text-lg font-bold text-slate-700 mb-2" id="loading-title">Memuat Sandi Rahasia...</h3>
            <p class="text-slate-500 text-sm" id="loading-message">Menghubungkan ke database</p>
            <div id="error-actions" class="hidden mt-6">
                <button onclick="location.reload()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition shadow-lg">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Coba Lagi
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden absolute inset-0 z-30 bg-white flex-col items-center justify-center text-center p-8 pop-in">
            <i class="fa-solid fa-user-secret text-6xl text-slate-800 mb-4"></i>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Misi Selesai!</h2>
            <p class="text-slate-500 mb-6">Kamu telah memecahkan semua kode rahasia.</p>
            
            <div class="mb-8 p-6 bg-slate-50 rounded-xl border border-slate-200 w-full max-w-sm">
                <div class="text-sm text-slate-500 font-medium uppercase tracking-wide mb-1">Total Skor</div>
                <div class="text-5xl font-extrabold text-red-600 mb-2" id="final-score">0</div>
            </div>

            <div class="flex gap-3 w-full max-w-xs">
                <button onclick="location.reload()" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition shadow-lg">
                    Ulangi Misi
                </button>
                <a href="index.html" class="flex-1 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-300 transition flex items-center justify-center">
                    Menu
                </a>
            </div>
        </div>

        <!-- Quiz Area -->
        <div id="quiz-area" class="p-6 md:p-10 flex-grow flex flex-col justify-center hidden">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2 mb-6">
                <div id="progress-bar" class="bg-red-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <!-- Question Info -->
            <div class="flex flex-col items-center justify-center mb-6">
                <span class="inline-block px-4 py-1.5 bg-slate-100 text-slate-600 border border-slate-200 rounded-full text-xs font-bold mb-4 uppercase tracking-widest">
                    Pesan <span id="current-question-num">1</span> / <span id="total-questions">10</span>
                </span>
                
                <p class="text-sm text-slate-500 mb-2">Dekripsi pesan berikut:</p>
                <div class="bg-slate-800 text-white px-8 py-4 rounded-xl border-2 border-slate-700 shadow-inner font-mono text-2xl md:text-3xl tracking-[0.2em] font-bold text-center break-all w-full max-w-lg" id="question-text">
                    <!-- Soal (Clue) muncul di sini -->
                </div>
            </div>

            <!-- Kotak Jawaban (Dynamic Inputs) -->
            <div id="input-container" class="flex flex-wrap justify-center gap-2 md:gap-3 mb-8">
                <!-- Input kotak akan di-generate oleh Javascript -->
            </div>

            <!-- Action Button -->
            <button id="submit-btn" onclick="checkAnswer()" 
                class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-lg shadow-lg shadow-red-200 transition transform active:scale-95 flex items-center justify-center gap-2 mt-auto">
                <span>Cek Sandi</span> <i class="fa-solid fa-unlock-keyhole"></i>
            </button>

            <!-- Feedback Message -->
            <div id="feedback" class="mt-4 text-center h-6 font-semibold text-lg transition-opacity opacity-0">
                <!-- Feedback muncul di sini -->
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // ==========================================
        // KONFIGURASI
        // ==========================================
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRTESr5U38MR01quLz0VXcrwVcanIJUvMPjPX5lNOY40lP5p4czGenzphqymxPlSPmAnJVVYeL70M1/pub?gid=675815415&single=true&output=csv'; 

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const ui = {
            loading: document.getElementById('loading-screen'),
            loaderIcon: document.getElementById('loader-icon'),
            loadingTitle: document.getElementById('loading-title'),
            loadingMessage: document.getElementById('loading-message'),
            errorActions: document.getElementById('error-actions'),
            quizArea: document.getElementById('quiz-area'),
            gameOver: document.getElementById('game-over-screen'),
            questionText: document.getElementById('question-text'),
            currentNum: document.getElementById('current-question-num'),
            totalNum: document.getElementById('total-questions'),
            progressBar: document.getElementById('progress-bar'),
            scoreDisplay: document.getElementById('score'),
            finalScore: document.getElementById('final-score'),
            feedback: document.getElementById('feedback'),
            card: document.querySelector('.glass-panel'),
            fsIcon: document.getElementById('fullscreen-icon'),
            inputContainer: document.getElementById('input-container'),
            submitBtn: document.getElementById('submit-btn')
        };

        // --- Init Game ---
        function initGame() {
            if (!GOOGLE_SHEET_CSV_URL) return;

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false, // Tidak pakai header, langsung baca baris 1
                complete: function(results) {
                    const success = processData(results.data);
                    if (!success) {
                        showError("Data Kosong", "Pastikan CSV memiliki minimal 2 kolom (Clue & Jawaban).");
                    }
                },
                error: function(err) {
                    console.error("Gagal ambil CSV:", err);
                    showError("Gagal Terhubung", "Tidak dapat menghubungi database. Periksa koneksi internet Anda.");
                }
            });
        }

        function showError(title, message) {
            ui.loaderIcon.className = "fa-solid fa-triangle-exclamation text-5xl text-red-500 mb-4";
            ui.loadingTitle.innerText = title;
            ui.loadingTitle.classList.add("text-red-600");
            ui.loadingMessage.innerText = message;
            ui.errorActions.classList.remove("hidden");
        }

        function processData(rawData) {
            if (!rawData || rawData.length === 0) return false;

            // Baca dari baris pertama (index 0)
            const processedQuestions = rawData
                .filter(row => row && row[0] && row[1]) 
                .map(row => ({
                    question: row[0].trim(),
                    answer: row[1].trim().toUpperCase()
                }));

            if (processedQuestions.length > 0) {
                questions = processedQuestions;
                questions.sort(() => Math.random() - 0.5); // Acak soal

                ui.loading.classList.add('hidden');
                ui.quizArea.classList.remove('hidden');
                ui.totalNum.innerText = questions.length;
                
                loadQuestion();
                return true; 
            }
            return false; 
        }

        // --- Load Question & Generate Boxes ---
        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            
            ui.questionText.innerText = q.question;
            ui.currentNum.innerText = currentQuestionIndex + 1;
            ui.feedback.style.opacity = '0';
            
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            ui.progressBar.style.width = `${progress}%`;
            
            // Tombol di-reset
            ui.submitBtn.disabled = false;
            ui.submitBtn.innerHTML = `<span>Cek Sandi</span> <i class="fa-solid fa-unlock-keyhole"></i>`;
            ui.submitBtn.classList.replace('bg-green-600', 'bg-red-600');
            ui.submitBtn.classList.replace('hover:bg-green-700', 'hover:bg-red-700');

            createInputBoxes(q.answer);
        }

        function createInputBoxes(answer) {
            ui.inputContainer.innerHTML = ''; 

            for (let i = 0; i < answer.length; i++) {
                const char = answer[i];

                if (char === ' ' || char === '-') {
                    const separator = document.createElement('div');
                    separator.className = 'w-4 md:w-6 h-12 flex items-center justify-center text-slate-400 font-bold';
                    separator.innerText = char === '-' ? '-' : '';
                    ui.inputContainer.appendChild(separator);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.className = 'char-input w-10 h-12 md:w-12 md:h-14 border-2 border-slate-300 rounded-lg text-center text-xl md:text-2xl font-bold uppercase text-slate-700 focus:outline-none transition-colors bg-white';
                    
                    input.addEventListener('input', (e) => handleInput(e, input));
                    input.addEventListener('keydown', (e) => handleKeyDown(e, input));
                    input.addEventListener('focus', () => input.select());

                    ui.inputContainer.appendChild(input);
                }
            }

            const firstInput = ui.inputContainer.querySelector('input');
            if(firstInput) setTimeout(() => firstInput.focus(), 100);
        }

        // --- Input Handling ---
        function handleInput(e, input) {
            const val = e.target.value.toUpperCase();
            e.target.value = val; 

            if (val.length === 1) {
                let next = input.nextElementSibling;
                while (next && next.tagName !== 'INPUT') next = next.nextElementSibling;
                if (next) next.focus();
            }
        }

        function handleKeyDown(e, input) {
            if (e.key === 'Backspace' && input.value === '') {
                let prev = input.previousElementSibling;
                while (prev && prev.tagName !== 'INPUT') prev = prev.previousElementSibling;
                if (prev) prev.focus();
            } else if (e.key === 'Enter') {
                checkAnswer();
            } else if (e.key === 'ArrowRight') {
                let next = input.nextElementSibling;
                while (next && next.tagName !== 'INPUT') next = next.nextElementSibling;
                if (next) next.focus();
            } else if (e.key === 'ArrowLeft') {
                let prev = input.previousElementSibling;
                while (prev && prev.tagName !== 'INPUT') prev = prev.previousElementSibling;
                if (prev) prev.focus();
            }
        }

        // --- Game Logic ---
        function checkAnswer() {
            if (ui.submitBtn.disabled) return; // Mencegah double click saat delay transisi

            const inputs = ui.inputContainer.querySelectorAll('input');
            let fullUserAnswer = ''; 
            let inputIndex = 0;
            const correctAnswer = questions[currentQuestionIndex].answer;

            for (let i = 0; i < correctAnswer.length; i++) {
                const char = correctAnswer[i];
                if (char === ' ' || char === '-') {
                    fullUserAnswer += char;
                } else {
                    if (inputs[inputIndex]) {
                        fullUserAnswer += inputs[inputIndex].value.toUpperCase();
                        inputIndex++;
                    }
                }
            }

            let isComplete = true;
            inputs.forEach(inp => { if(inp.value === '') isComplete = false; });
            
            if (!isComplete) {
                showFeedback(false, "Lengkapi pesan terlebih dahulu!");
                inputs.forEach(inp => {
                    if(inp.value === '') inp.classList.add('border-red-400');
                    setTimeout(() => inp.classList.remove('border-red-400'), 500);
                });
                return;
            }

            const cleanUser = fullUserAnswer.replace(/[^A-Z0-9]/g, '');
            const cleanKey = correctAnswer.replace(/[^A-Z0-9]/g, '');

            if (cleanUser === cleanKey) {
                // --- BENAR ---
                score += 10;
                ui.scoreDisplay.innerText = score;
                
                inputs.forEach(inp => {
                    inp.disabled = true;
                    inp.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                });

                ui.submitBtn.disabled = true;
                ui.submitBtn.classList.replace('bg-red-600', 'bg-green-600');
                ui.submitBtn.classList.replace('hover:bg-red-700', 'hover:bg-green-700');
                ui.submitBtn.innerHTML = `<span>Terpecahkan!</span> <i class="fa-solid fa-check"></i>`;

                showFeedback(true, `Sandi Berhasil Didekripsi! 🎉`);
                
                // Lanjut ke soal berikutnya secara otomatis
                setTimeout(() => nextQuestion(), 1500);

            } else {
                // --- SALAH (Bisa Coba Lagi Terus) ---
                showFeedback(false, "Sandi Salah, coba pecahkan lagi!");
                
                inputs.forEach(inp => {
                    inp.value = ''; 
                    inp.classList.add('border-red-500'); 
                });
                
                ui.card.classList.add('wrong-anim');
                setTimeout(() => {
                    ui.card.classList.remove('wrong-anim');
                    inputs.forEach(inp => inp.classList.remove('border-red-500'));
                    inputs[0].focus();
                }, 500);
            }
        }

        function showFeedback(isCorrect, message) {
            ui.feedback.innerText = message;
            ui.feedback.style.opacity = '1';
            let colorClass = isCorrect ? 'text-green-600' : 'text-red-500';
            ui.feedback.className = `mt-4 text-center h-6 font-bold text-lg transition-opacity ${colorClass}`;
            
            if(isCorrect) {
                ui.card.classList.remove('correct-anim', 'wrong-anim');
                void ui.card.offsetWidth; 
                ui.card.classList.add('correct-anim');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            ui.quizArea.classList.add('hidden');
            ui.gameOver.classList.remove('hidden');
            ui.gameOver.classList.add('flex');
            ui.finalScore.innerText = score;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
                ui.fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    ui.fsIcon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        initGame();

    </script>
</body>
</html>
