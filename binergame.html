<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Switch - Belajar Biner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Efek Lampu Menyala */
        .bulb-on {
            background: radial-gradient(circle, #fde047 0%, #eab308 60%, #a16207 100%);
            box-shadow: 0 0 20px #facc15, 0 0 40px #facc15 inset;
            border-color: #fef08a;
            transform: scale(1.05);
        }

        /* Efek Lampu Mati */
        .bulb-off {
            background: radial-gradient(circle, #475569 0%, #1e293b 100%);
            box-shadow: inset 0 0 10px #0f172a;
            border-color: #334155;
        }

        /* Animasi Transisi */
        .bulb-container {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .switch-toggle {
            transition: transform 0.2s ease;
        }
        .active-switch .switch-toggle {
            transform: translateY(100%);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
        <div class="absolute top-10 left-10 w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-3xl animate-pulse"></div>
        <div class="absolute bottom-10 right-10 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-3xl animate-pulse" style="animation-duration: 4s;"></div>
    </div>

    <!-- Tombol Fullscreen -->
    <button onclick="toggleFullScreen()" class="fixed top-4 right-4 z-50 bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full backdrop-blur-md transition shadow-lg flex items-center justify-center border border-white/20" title="Layar Penuh">
        <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
    </button>

    <!-- Container Utama -->
    <div class="max-w-5xl w-full glass-panel rounded-3xl shadow-2xl relative z-10 flex flex-col min-h-[85vh] text-white">
        
        <!-- Header -->
        <div class="border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-slate-400 hover:text-white transition flex items-center gap-2 font-medium">
                    <i class="fa-solid fa-arrow-left"></i> Kembali
                </a>
                <div class="h-6 w-px bg-slate-700"></div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb text-yellow-400"></i> <span class="hidden sm:inline">The Binary Switch</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-600 text-sm">
                    Level: <span id="level-display" class="font-bold text-blue-400">1</span>
                </div>
                <div class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-600 text-sm">
                    Skor: <span id="score-display" class="font-bold text-yellow-400">0</span>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="flex-grow flex flex-col items-center justify-center p-6 md:p-10 relative">
            
            <!-- Target Display -->
            <div class="mb-10 text-center relative">
                <div class="text-sm text-slate-400 uppercase tracking-widest mb-2">Target Angka (Desimal)</div>
                <div class="font-tech text-6xl md:text-8xl font-bold text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]" id="target-number">
                    0
                </div>
                <!-- Current Sum Display (Feedback) -->
                <div class="mt-4 flex items-center justify-center gap-2">
                    <span class="text-slate-400">Total Saat Ini:</span>
                    <span id="current-sum" class="font-tech text-2xl md:text-3xl text-red-500 font-bold">0</span>
                </div>
            </div>

            <!-- The Binary Bulbs Container -->
            <div id="bulbs-container" class="flex flex-wrap justify-center gap-3 md:gap-6 mb-12 max-w-4xl">
                <!-- Bulbs will be generated by JS based on Level -->
            </div>

            <!-- Controls -->
            <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                <button onclick="checkAnswer()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/50 transition transform active:scale-95 text-lg">
                    CEK JAWABAN
                </button>
                <button onclick="resetSwitches()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-4 rounded-xl transition transform active:scale-95 text-lg">
                    RESET SAKLAR
                </button>
            </div>

            <!-- Feedback Message -->
            <div id="feedback-msg" class="absolute bottom-4 left-0 w-full text-center font-bold text-xl h-8 opacity-0 transition-opacity duration-300">
                <!-- Feedback text here -->
            </div>

        </div>

        <!-- Level Selector / Info (Bottom Bar) -->
        <div class="bg-slate-800/50 border-t border-slate-700 p-4 text-center">
            <div class="flex justify-center gap-2 mb-2">
                <button onclick="setLevel(1)" class="px-3 py-1 text-xs rounded border border-slate-600 hover:bg-slate-700 transition level-btn active-level" id="btn-lvl-1">Level 1 (4 Bit)</button>
                <button onclick="setLevel(2)" class="px-3 py-1 text-xs rounded border border-slate-600 hover:bg-slate-700 transition level-btn" id="btn-lvl-2">Level 2 (6 Bit)</button>
                <button onclick="setLevel(3)" class="px-3 py-1 text-xs rounded border border-slate-600 hover:bg-slate-700 transition level-btn" id="btn-lvl-3">Level 3 (8 Bit)</button>
            </div>
            <p class="text-xs text-slate-500">
                <i class="fa-regular fa-lightbulb text-yellow-500"></i> Tips: Nyalakan lampu yang nilainya jika dijumlahkan sama dengan target.
            </p>
        </div>
    </div>

    <!-- WIN MODAL -->
    <div id="win-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-600 p-8 rounded-2xl text-center max-w-sm mx-4 shadow-2xl transform scale-100">
            <i class="fa-solid fa-trophy text-6xl text-yellow-400 mb-4 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-white mb-2">Luar Biasa!</h2>
            <p class="text-slate-300 mb-6">Jawabanmu Benar. Lanjut soal berikutnya?</p>
            <button onclick="nextRound()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl shadow-lg transition">
                Lanjut Main <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // GAME STATE
        // ==========================================
        let currentLevel = 1;
        let score = 0;
        let targetNum = 0;
        let activeBits = []; // Array of boolean [false, false, ...]
        
        // Konfigurasi Level
        const levels = {
            1: { bits: 4, max: 15 },  // 8, 4, 2, 1
            2: { bits: 6, max: 63 },  // 32, 16, 8, 4, 2, 1
            3: { bits: 8, max: 255 }  // 128, 64, ..., 1
        };

        const bulbsContainer = document.getElementById('bulbs-container');
        const targetDisplay = document.getElementById('target-number');
        const currentSumDisplay = document.getElementById('current-sum');
        const scoreDisplay = document.getElementById('score-display');
        const feedbackMsg = document.getElementById('feedback-msg');
        const winModal = document.getElementById('win-modal');

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function initGame() {
            renderBulbs();
            generateNewTarget();
            updateScore();
            updateStyles();
        }

        // 1. Render Bulbs based on Level
        function renderBulbs() {
            bulbsContainer.innerHTML = '';
            const bitCount = levels[currentLevel].bits;
            activeBits = new Array(bitCount).fill(false); // Reset state

            for (let i = 0; i < bitCount; i++) {
                // Hitung nilai bit (Powers of 2: 2^n)
                // Urutan dari kiri ke kanan (MSB to LSB), jadi pangkatnya (bitCount - 1 - i)
                const bitVal = Math.pow(2, bitCount - 1 - i);
                
                // Container Lampu
                const bulbWrapper = document.createElement('div');
                bulbWrapper.className = 'bulb-container flex flex-col items-center gap-2 cursor-pointer group';
                bulbWrapper.onclick = () => toggleBulb(i, bitVal);

                // Lampu Visual
                const bulb = document.createElement('div');
                bulb.id = `bulb-${i}`;
                bulb.className = 'bulb-off w-12 h-12 md:w-16 md:h-16 rounded-full border-4 transition-all duration-300 flex items-center justify-center';
                
                // Icon dalam lampu (0 atau 1)
                bulb.innerHTML = `<span class="font-tech text-lg md:text-xl font-bold opacity-50" id="bulb-text-${i}">0</span>`;

                // Label Nilai Bit (bawah lampu)
                const label = document.createElement('div');
                label.className = 'bg-slate-800 px-2 py-1 rounded text-xs md:text-sm font-mono text-slate-400 border border-slate-700 group-hover:border-blue-500 transition-colors';
                label.innerText = bitVal;

                bulbWrapper.appendChild(bulb);
                bulbWrapper.appendChild(label);
                bulbsContainer.appendChild(bulbWrapper);
            }
        }

        // 2. Generate Target
        function generateNewTarget() {
            const max = levels[currentLevel].max;
            // Pastikan target > 0
            targetNum = Math.floor(Math.random() * max) + 1;
            targetDisplay.innerText = targetNum;
            
            // Reset switches visual
            resetSwitches(false); // false = jangan generate target baru
        }

        // 3. Toggle Logic
        function toggleBulb(index, val) {
            activeBits[index] = !activeBits[index]; // Flip state
            
            const bulb = document.getElementById(`bulb-${index}`);
            const bulbText = document.getElementById(`bulb-text-${index}`);
            
            if (activeBits[index]) {
                // Nyalakan
                bulb.classList.remove('bulb-off');
                bulb.classList.add('bulb-on');
                bulbText.innerText = '1';
                bulbText.classList.remove('opacity-50');
                bulbText.classList.add('text-yellow-900');
            } else {
                // Matikan
                bulb.classList.remove('bulb-on');
                bulb.classList.add('bulb-off');
                bulbText.innerText = '0';
                bulbText.classList.add('opacity-50');
                bulbText.classList.remove('text-yellow-900');
            }

            calculateSum();
        }

        // 4. Calculate Current Sum
        function calculateSum() {
            let sum = 0;
            const bitCount = levels[currentLevel].bits;
            
            for (let i = 0; i < bitCount; i++) {
                if (activeBits[i]) {
                    sum += Math.pow(2, bitCount - 1 - i);
                }
            }

            currentSumDisplay.innerText = sum;
            
            // Visual feedback on sum color
            if (sum === targetNum) {
                currentSumDisplay.className = "font-tech text-2xl md:text-3xl text-green-400 font-bold drop-shadow-[0_0_10px_rgba(74,222,128,0.5)]";
            } else if (sum > targetNum) {
                currentSumDisplay.className = "font-tech text-2xl md:text-3xl text-red-500 font-bold";
            } else {
                currentSumDisplay.className = "font-tech text-2xl md:text-3xl text-yellow-500 font-bold";
            }

            return sum;
        }

        // 5. Check Answer
        function checkAnswer() {
            const sum = calculateSum();
            if (sum === targetNum) {
                // WIN
                score += (currentLevel * 10);
                updateScore();
                showWinModal();
            } else {
                // LOSE / TRY AGAIN
                showFeedback(false, sum > targetNum ? "Terlalu Tinggi!" : "Masih Kurang!");
                // Shake effect
                targetDisplay.classList.add('animate-bounce');
                setTimeout(() => targetDisplay.classList.remove('animate-bounce'), 500);
            }
        }

        function showWinModal() {
            winModal.classList.remove('hidden');
            // Confetti effect simple sound could be added here
        }

        function nextRound() {
            winModal.classList.add('hidden');
            generateNewTarget();
            showFeedback(true, "Level Berikutnya!");
        }

        function resetSwitches(newTarget = true) {
            const bitCount = levels[currentLevel].bits;
            activeBits = new Array(bitCount).fill(false);
            
            // Reset visual without re-rendering DOM (smoother)
            for (let i = 0; i < bitCount; i++) {
                const bulb = document.getElementById(`bulb-${i}`);
                const bulbText = document.getElementById(`bulb-text-${i}`);
                bulb.classList.remove('bulb-on');
                bulb.classList.add('bulb-off');
                bulbText.innerText = '0';
                bulbText.classList.add('opacity-50');
                bulbText.classList.remove('text-yellow-900');
            }
            calculateSum();
            
            if (newTarget) showFeedback(true, "Direset!");
        }

        // 6. Level System
        function setLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('level-display').innerText = lvl;
            
            // Update button styles
            document.querySelectorAll('.level-btn').forEach((btn, idx) => {
                if(idx + 1 === lvl) {
                    btn.classList.add('bg-blue-600', 'border-blue-500', 'text-white');
                    btn.classList.remove('border-slate-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'border-blue-500', 'text-white');
                    btn.classList.add('border-slate-600');
                }
            });

            // Re-init game for new level
            renderBulbs();
            generateNewTarget();
        }

        // Utilities
        function updateScore() {
            scoreDisplay.innerText = score;
        }

        function showFeedback(isPositive, text) {
            feedbackMsg.innerText = text;
            feedbackMsg.className = `absolute bottom-4 left-0 w-full text-center font-bold text-xl h-8 transition-opacity duration-300 ${isPositive ? 'text-green-400' : 'text-red-400'}`;
            feedbackMsg.style.opacity = '1';
            
            setTimeout(() => {
                feedbackMsg.style.opacity = '0';
            }, 1500);
        }

        function updateStyles() {
            // Initial styling for level buttons
            setLevel(1);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
                document.getElementById('fullscreen-icon').classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreen-icon').classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // Start
        initGame();

    </script>
</body>
</html>
